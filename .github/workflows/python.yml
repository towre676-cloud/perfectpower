name: Exact arithmetic checks
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests
        run: |
          python -m pip install '.[research,test]'
          make test
      - name: Function-based pytest regressions
        run: |
          python -m pytest -q python/tests/test_flavor_frontier.py python/tests/test_flavor_functional_mass.py python/tests/test_flavor_gauge_feedback.py python/tests/test_flavor_scalar_feedback.py python/tests/test_flavor_singlet_mediation.py python/tests/test_flavor_singlet_quantum.py python/tests/test_flavor_spectral_matching.py python/tests/test_logarithmic_quartic.py python/tests/test_valentiner_exact_vacuum_curve.py python/tests/test_valentiner_mediator_closure.py python/tests/test_valentiner_direct_stabilizer.py python/tests/test_valentiner_nonet_joint.py
      - name: Regenerate receipts, data and generated Lean; must match the commit
        run: |
          make receipts
          git diff --exit-code -- receipts/ data/ PerfectPower/Generated/
      - name: Reproduce exact PSG source, fibres and finite model spaces
        run: |
          make psg-structural
          git diff --exit-code -- receipts/psg_structural/ PerfectPower/Generated/PSGStructuralPackets.lean
      - name: Reproduce enhanced SOE bridge and finite optimal diagnosis
        run: |
          make soe-bridge
          git diff --exit-code -- receipts/soe_bridge/
      - name: Reproduce structural species, inequalities and two-isogeny bounds
        run: |
          make structural-math
          git diff --exit-code -- receipts/structural_math/
      - name: Reproduce exact arithmetic-series and binary64 receipts
        run: |
          PYTHONPATH=python python python/run_arithmetic_series.py
          git diff --exit-code -- receipts/arithmetic_series/
      - name: Reproduce boundary-complete telescoping receipts
        run: |
          PYTHONPATH=python python python/run_telescoping.py
          git diff --exit-code -- receipts/telescoping/
