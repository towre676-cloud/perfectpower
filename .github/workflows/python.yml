name: Exact arithmetic checks
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tests
        run: make test
      - name: Regenerate receipts, data and generated Lean; must match the commit
        run: |
          make receipts
          git diff --exit-code -- receipts/ data/ PerfectPower/Generated/
