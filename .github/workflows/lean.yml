name: Lean kernel
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build against the pinned Mathlib (fetches the Mathlib build cache)
        uses: leanprover/lean-action@v1
      - name: Axiom audit (no sorry, no custom axioms)
        run: ./audit/check_axioms.sh
