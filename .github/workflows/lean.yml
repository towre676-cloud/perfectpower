name: Lean kernel
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build against the pinned Mathlib (fetches the Mathlib build cache)
        uses: leanprover/lean-action@v1
      - name: Native Runge complete-point and rejection audit
        run: scripts/check_native_runge.sh
      - name: Original bounded equations, signed roots, ranks and tied minima
        run: python3 -m unittest discover -s python/tests -p 'test_checked_box.py'
        env:
          PYTHONPATH: python
          PERFECTPOWER_LEAN: lean
      - name: Reusable original-coordinate polynomial population queries
        run: bash scripts/check_population_queries.sh
        env:
          PERFECTPOWER_LEAN: lean
      - name: Native higher-power Runge and binary-root audit
        run: scripts/check_native_runge_power.sh
      - name: Parallel-session algebra and exact certificate audit
        run: scripts/check_parallel_push.sh
      - name: Monograph exceptional-search and operator certificate audit
        run: scripts/check_monograph_push.sh
      - name: Integer-root and finite graph-event audit
        run: scripts/check_root_events.sh
      - name: Arithmetic simplifier composition audit
        run: scripts/check_arithmetic_simplifier.sh
      - name: Gamma arithmetic and integral output transport audit
        run: scripts/check_gamma_arithmetic.sh
      - name: Universal factorial units and original Landau integrality
        run: bash scripts/check_gamma_bridges.sh
      - name: Signed charts and semilinear certificate audit
        run: scripts/check_semilinear_capacity.sh
      - name: Dresden polynomial calendar and numerical-model axiom audit
        run: bash scripts/check_dresden_lean.sh
      - name: Coefficient power charts and recurrence dynamics
        run: scripts/check_query_space.sh
      - name: Voronoi enclosure and metric transport
        run: scripts/check_voronoi_enclosure.sh
      - name: Exact chart bounds, bivariate arithmetic and kernel packet replay
        run: scripts/check_metric_boxes.sh
      - name: Axiom audit (no sorry, no custom axioms, no ofReduceBool)
        run: ./audit/check_axioms.sh
      - name: Batteries linters on the hand-written library
        run: lake env lean audit/Lint.lean
      - name: README counts match the audit
        run: |
          python3 python/make_counts.py
          git diff --exit-code -- README.md audit/axioms_report.txt
