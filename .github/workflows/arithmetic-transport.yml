name: Arithmetic transport kernel and exact populations
on:
  push:
    branches: [main]
    paths: ['PerfectPower/ArithmeticHeightPauli.lean','PerfectPower/ArithmeticModes.lean','python/perfectpower/arithmetic_modes.py','python/tests/test_arithmetic_modes.py','scripts/check_arithmetic_modes_kernel.py','scripts/check_arithmetic_modes.cjs','python/perfectpower/arithmetic_transport.py','python/tests/test_arithmetic_transport.py','scripts/check_arithmetic_transport_kernel.py','web/arithmetic-transport/**','.github/workflows/arithmetic-transport.yml']
  workflow_dispatch:
jobs:
  finite-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest
      - run: PYTHONPATH=python python -m pytest -q python/tests/test_arithmetic_transport.py python/tests/test_arithmetic_modes.py
      - run: node scripts/check_arithmetic_transport.cjs
      - run: node scripts/check_arithmetic_modes.cjs
      - name: Install pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.20.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: python scripts/check_arithmetic_transport_kernel.py
      - run: python scripts/check_arithmetic_modes_kernel.py
