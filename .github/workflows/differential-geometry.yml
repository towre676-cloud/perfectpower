name: Differential geometry
on:
  push:
  pull_request:
jobs:
  exact-dynamics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[differential]'
      - run: make differential-geometry
      - run: git diff --exit-code -- receipts/michor_geometry examples/michor_geometry web/michor_geometry/data.js
