name: Movement language and source-only feature engine
on:
  push:
    branches: [main]
    paths: ['python/perfectpower/movement_*.py','python/tests/test_movement_*.py','scripts/run_movement_transfer.py','.github/workflows/movement-language.yml']
  workflow_dispatch:
jobs:
  finite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pandas scikit-learn
      - run: PYTHONPATH=python python -m unittest python/tests/test_movement_language.py python/tests/test_movement_features.py python/tests/test_movement_transfer.py
