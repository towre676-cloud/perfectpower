name: Publish current Explorer research data
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: explorer-live-main
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: PYTHONPATH=python python -m pytest -q python/tests/test_research_counting.py python/tests/test_explorer_live.py
      - run: python scripts/export_explorer_live.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check_browser_counter.cjs
      - run: python scripts/export_app_ecosystem.py
      - run: python scripts/export_app_web.py
      - name: Commit regenerated public data, preserving concurrent work
        run: |
          git config user.name 'PerfectPower data publisher'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/explorer_live.json data/browser_counter.json data/app_web_live.json receipts/research_counting
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh live Explorer research counts'
          git pull --rebase origin main
          git push origin HEAD:main
