plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
    namespace 'com.perfectpower.explorer'
    compileSdk 35
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    defaultConfig {
        applicationId 'com.perfectpower.explorer'
        minSdk 33
        targetSdk 35
        versionCode 4
        versionName '1.3.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    androidResources { noCompress 'zip' }
    packaging { jniLibs { useLegacyPackaging true } }
}
chaquopy {
    defaultConfig {
        version '3.10'
        buildPython(System.getenv('PP_BUILD_PYTHON') ?: 'python3.10')
        pip { install 'numpy==1.23.3'; install 'scipy==1.8.1'; install 'sympy==1.14.0'; install 'mpmath==1.3.0' }
        pyc { src false }
    }
}
